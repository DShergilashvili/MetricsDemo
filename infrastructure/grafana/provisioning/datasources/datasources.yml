apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      queryTimeout: 60s
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: traceId
          datasourceUid: jaeger
    version: 1

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id="?([0-9a-fA-F]{32})"?'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: 'View Trace'
        - name: TraceId
          matcherRegex: '"?TraceId"?\s*[:=]\s*"?([0-9a-fA-F]{32})"?'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: 'View Trace'
    version: 1

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        mapTagNamesEnabled: true
        mappedTags:
          - key: service.name
            value: service
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
        queries:
          - name: 'Request Rate'
            query: 'sum(rate(http_server_requests_seconds_count{service="$${service}"}[5m]))'
          - name: 'Error Rate'
            query: 'sum(rate(http_server_requests_seconds_count{service="$${service}", status=~"5.."}[5m]))'
          - name: 'Latency p95'
            query: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="$${service}"}[5m])) by (le))'
      nodeGraph:
        enabled: true
    version: 1
